<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Non-blocking storage warning banner (hidden by default) -->
    <div id="warning-banner" style="display: none;"></div>

    <div class="container">
      <!-- Requirement 6.3: Balance at top -->
      <section id="balance-section">
        <h1>Total Spending</h1>
        <div id="balance-display">$0.00</div>
      </section>

      <!-- Input Form -->
      <section id="form-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              placeholder="e.g. Lunch"
              autocomplete="off"
            />
            <span class="error" id="error-name"></span>
          </div>

          <div class="field-group">
            <label for="item-amount">Amount</label>
            <input
              type="number"
              id="item-amount"
              name="item-amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
            />
            <span class="error" id="error-amount"></span>
          </div>

          <div class="field-group">
            <label for="item-category">Category</label>
            <select id="item-category" name="item-category">
              <option value="">-- Select category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="error" id="error-category"></span>
          </div>

          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- Chart and Transaction List (side-by-side at ≥600px) -->
      <div class="chart-list-wrapper">
        <!-- Pie Chart -->
        <section id="chart-section">
          <h2>Spending by Category</h2>
          <canvas id="expense-chart" aria-label="Spending distribution pie chart" role="img"></canvas>
        </section>

        <!-- Transaction List -->
        <section id="list-section">
          <h2>Transactions</h2>
          <div id="transaction-list"></div>
        </section>
      </div>
    </div>

    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App logic -->
    <script src="js/app.js" defer></script>
  </body>
</html>
